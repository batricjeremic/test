# One deployment stage, instantiated once per environment.
#
# Order inside the stage is not cosmetic: migrations run and must succeed
# before the new revision takes traffic, and the container is updated before
# the hub is packaged so the extension is never newer than the API it calls.

parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: environmentName
    type: string
  - name: branch
    type: string
  # Variable group, one per environment. Back it with Key Vault — it holds
  # DATABASE_URL and the Azure DevOps service PAT.
  #
  # Expected variables:
  #   azureSubscription   service connection name
  #   resourceGroup       resource group holding the container app
  #   acrName             container registry name
  #   containerAppName    the container app
  #   bffBaseUrl          public HTTPS URL of this environment's API
  #   databaseUrl         (secret) Postgres connection string
  - name: variableGroup
    type: string

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: Verify
    condition: >-
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], '${{ parameters.branch }}'),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    variables:
      - group: ${{ parameters.variableGroup }}
    jobs:
      # -----------------------------------------------------------------
      # API: image, migrations, then the rollout.
      # -----------------------------------------------------------------
      - deployment: Api
        displayName: Board API
        environment: ${{ parameters.environmentName }}
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 30
        strategy:
          runOnce:
            deploy:
              steps:
                # Deployment jobs do not check out sources by default.
                - checkout: self

                - task: AzureCLI@2
                  displayName: Build image in ACR
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az acr build \
                        --registry "$(acrName)" \
                        --image "sprint-board-api:$(Build.BuildId)" \
                        --file infra/Dockerfile .

                - task: NodeTool@0
                  inputs:
                    versionSpec: '22.x'
                - script: corepack enable
                  displayName: Enable corepack
                - script: pnpm install --frozen-lockfile
                  displayName: Install

                # Migrations are a pipeline step by design — the service never
                # runs them on boot. The runner takes an advisory lock, so two
                # concurrent pipeline runs cannot race, and it refuses to run if
                # an applied migration's checksum changed.
                #
                # The agent must be able to reach Postgres: allow Azure services
                # on the flexible server, or run this on a self-hosted agent
                # inside the network.
                - script: pnpm db:migrate
                  displayName: Apply migrations
                  env:
                    DATABASE_URL: $(databaseUrl)

                - task: AzureCLI@2
                  displayName: Roll the container app
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az containerapp update \
                        --name "$(containerAppName)" \
                        --resource-group "$(resourceGroup)" \
                        --image "$(acrName).azurecr.io/sprint-board-api:$(Build.BuildId)"

                      # One replica is a requirement, not a default: WebSocket
                      # subscriptions live in process memory and the sync worker
                      # would otherwise run in every replica, multiplying load on
                      # the shared rate budget. See ADR 0005.
                      az containerapp update \
                        --name "$(containerAppName)" \
                        --resource-group "$(resourceGroup)" \
                        --min-replicas 1 --max-replicas 1

                - task: AzureCLI@2
                  displayName: Smoke check readiness
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      for i in $(seq 1 30); do
                        code=$(curl -s -o /dev/null -w '%{http_code}' "$(bffBaseUrl)/api/ready" || true)
                        if [ "$code" = "200" ]; then echo "ready"; exit 0; fi
                        echo "attempt $i: HTTP $code"; sleep 10
                      done
                      echo "the new revision never reported ready"; exit 1

      # -----------------------------------------------------------------
      # Hub: packaged AFTER the API is live, because the bundle hard-codes
      # this environment's BFF URL (see the note in docs/deploying.md).
      # -----------------------------------------------------------------
      - deployment: Hub
        displayName: Hub extension
        dependsOn: Api
        environment: ${{ parameters.environmentName }}
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 20
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: NodeTool@0
                  inputs:
                    versionSpec: '22.x'
                - script: corepack enable
                  displayName: Enable corepack
                - script: pnpm install --frozen-lockfile
                  displayName: Install
                - script: pnpm --filter @eg/shared build
                  displayName: Build shared contract

                # VITE_BFF_BASE_URL is baked into the bundle here. This is why
                # the .vsix cannot be promoted between environments as one
                # artifact — each environment gets its own build.
                - script: pnpm --filter @eg/board-hub build
                  displayName: Build hub
                  env:
                    VITE_BFF_BASE_URL: $(bffBaseUrl)

                - script: |
                    set -euo pipefail
                    npm i -g tfx-cli
                    cd apps/hub
                    # The Marketplace refuses a version it has already seen, so
                    # the build number becomes the patch version.
                    tfx extension create \
                      --manifest-globs vss-extension.json \
                      --rev-version \
                      --output-path "$(Build.ArtifactStagingDirectory)"
                  displayName: Package .vsix

                - publish: $(Build.ArtifactStagingDirectory)
                  artifact: vsix-${{ parameters.environmentName }}
                  displayName: Publish .vsix artifact

                # Publishing to the Marketplace and sharing with the
                # organisation is deliberately NOT automated: it changes what
                # every user of the organisation runs. Download the artifact and
                # upload it from the Manage page, or add a
                # TfxInstaller/PublishExtension task here once the publisher and
                # a service connection exist.
