# One deployment stage, instantiated once per environment.
#
# This deploys the API only. The extension is built once in the Package stage
# and the same .vsix serves every environment, because the hub reads its BFF
# endpoint from an organisation-wide extension setting at runtime.
#
# Order inside the stage is not cosmetic: migrations run and must succeed
# before the new revision takes traffic, and the stage does not pass until the
# new revision actually reports ready.

parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: environmentName
    type: string
  - name: branch
    type: string
  # Service connections are resolved when the template is compiled, so this
  # cannot come from a variable group at runtime — it must be a parameter.
  - name: azureSubscription
    type: string
  # Variable group, one per environment. Back it with Key Vault — it holds
  # DATABASE_URL and the Azure DevOps service PAT.
  #
  # Expected variables:
  #   resourceGroup       resource group holding the container app
  #   acrName             container registry name
  #   containerAppName    the container app
  #   bffBaseUrl          public HTTPS URL of this environment's API,
  #                       used here only for the readiness smoke check —
  #                       the hub reads its endpoint from an extension
  #                       setting at runtime, not from the build
  #   databaseUrl         (secret) Postgres connection string
  - name: variableGroup
    type: string

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: Verify
    condition: >-
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], '${{ parameters.branch }}'),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    variables:
      - group: ${{ parameters.variableGroup }}
    jobs:
      # -----------------------------------------------------------------
      # API: image, migrations, then the rollout.
      # -----------------------------------------------------------------
      - deployment: Api
        displayName: Board API
        environment: ${{ parameters.environmentName }}
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 30
        strategy:
          runOnce:
            deploy:
              steps:
                # Deployment jobs do not check out sources by default.
                - checkout: self

                - task: AzureCLI@2
                  displayName: Build image in ACR
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az acr build \
                        --registry "$(acrName)" \
                        --image "expertgroup/sprint-board-api:$(Build.BuildId)" \
                        --file infra/Dockerfile .

                - task: NodeTool@0
                  inputs:
                    versionSpec: '22.x'
                - script: corepack enable
                  displayName: Enable corepack
                - script: pnpm install --frozen-lockfile
                  displayName: Install

                # Migrations are a pipeline step by design — the service never
                # runs them on boot. The runner takes an advisory lock, so two
                # concurrent pipeline runs cannot race, and it refuses to run if
                # an applied migration's checksum changed.
                #
                # The agent must be able to reach Postgres: allow Azure services
                # on the flexible server, or run this on a self-hosted agent
                # inside the network.
                - script: pnpm db:migrate
                  displayName: Apply migrations
                  env:
                    DATABASE_URL: $(databaseUrl)

                - task: AzureCLI@2
                  displayName: Roll the container app
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az containerapp update \
                        --name "$(containerAppName)" \
                        --resource-group "$(resourceGroup)" \
                        --image "$(acrName).azurecr.io/expertgroup/sprint-board-api:$(Build.BuildId)"

                      # One replica is a requirement, not a default: WebSocket
                      # subscriptions live in process memory and the sync worker
                      # would otherwise run in every replica, multiplying load on
                      # the shared rate budget. See ADR 0005.
                      az containerapp update \
                        --name "$(containerAppName)" \
                        --resource-group "$(resourceGroup)" \
                        --min-replicas 1 --max-replicas 1

                - task: AzureCLI@2
                  displayName: Smoke check readiness
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      for i in $(seq 1 30); do
                        code=$(curl -s -o /dev/null -w '%{http_code}' "$(bffBaseUrl)/api/ready" || true)
                        if [ "$code" = "200" ]; then echo "ready"; exit 0; fi
                        echo "attempt $i: HTTP $code"; sleep 10
                      done
                      echo "the new revision never reported ready"; exit 1
